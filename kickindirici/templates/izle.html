<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>{{ name }}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icon.png">
<style>
  html,body{background:#000;min-height:100%}
  .watch{max-width:1200px;margin:0 auto;padding:12px 16px 32px}
  .watch header{margin:0 0 12px}
  .watch video{display:block;width:100%;max-height:80vh;background:#000;border-radius:10px}
  .watch h1{font-size:16px;font-weight:650;margin:14px 0 4px;word-break:break-word}
  .watch .sub{color:var(--muted);font-size:13px;word-break:break-word}
  .watch .acts{display:flex;gap:8px;margin-top:14px}
  .watch .err{display:none;margin-top:12px}
</style>
</head>
<body>
<main class="watch">
  <header><a href="/">← Geri</a></header>
  <video id="v" src="{{ src }}" controls autoplay playsinline preload="metadata"></video>
  <h1>{{ name }}</h1>
  <div class="sub">{{ title }}</div>
  <div class="acts"><a class="btn primary" href="{{ download }}" download>İndir</a></div>
  <div class="card warn err" id="err">Tarayıcı bu videoyu oynatamadı. "İndir" ile indirip bir oynatıcıyla açabilirsiniz (ör. VLC).</div>
</main>
<script>
  document.getElementById("v").addEventListener("error", () => { document.getElementById("err").style.display = "block"; });
</script>
</body>
</html>
