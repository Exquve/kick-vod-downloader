name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg önbelleği
        uses: actions/cache@v4
        with:
          path: vendor
          key: ffmpeg-essentials-${{ runner.os }}-2026-11

      - name: Derle (testler dahil)
        shell: pwsh
        run: ./build.ps1

      - name: Çıkış sonrası süreç kontrolü (exe)
        shell: pwsh
        run: |
          .venv\Scripts\python.exe scripts\exit_check.py dist\KickIndirici.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\KickIndirici.exe -Algorithm SHA256).Hash.ToLower()
          "$h  KickIndirici.exe" | Out-File -Encoding ascii dist\KickIndirici.exe.sha256
          Get-Content dist\KickIndirici.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: KickIndirici-${{ github.sha }}
          path: |
            dist/KickIndirici.exe
            dist/KickIndirici.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KickIndirici.exe
            dist/KickIndirici.exe.sha256
          generate_release_notes: true
